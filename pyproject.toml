[tool.ruff]
# Целевая версия Python
target-version = "py311"

# Максимальная длина строки (стандарт B2B Enterprise)
line-length = 120

# Исключить из проверки служебные папки и внешние зависимости
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Выбрать наборы правил:
# E, W - ошибки и предупреждения стиля PEP8 (pycodestyle)
# F - поиск критических ошибок (Pyflakes: неиспользуемые импорты/переменные, неопределенные имена)
# I - сортировка и группировка импортов (isort)
select = ["E", "F", "I", "W"]

# Игнорировать специфические правила для скриптов генерации и шаблонов:
# E501: длина строки (форматтер сам переносит, жесткий лимит не нужен)
# E402: импорты не в начале файла (в скриптах часто нужна настройка sys.path до импортов)
# W291, W293: хвостовые пробелы в многострочных строках/шаблонах документов
# E741: переменная l (в генераторах списков)
# E722: bare except в инфраструктурных скриптах
# F841: неиспользуемые переменные палитры цветов в генераторах отчетов
ignore = [
    "E501",
    "E402",
    "W291",
    "W293",
    "E741",
    "E722",
    "F841",
]

[tool.ruff.format]
# Использовать двойные кавычки (как Black)
quote-style = "double"
# Отступы 4 пробела
indent-style = "space"
# Переносы строк Unix LF
line-ending = "auto"
